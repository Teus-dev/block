<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090d16">
<title>block?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d16;--panel:#1e293b;--text:#f8fafc;--muted:#94a3b8;--gold:#fbbf24;--cyan:#22d3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 0%,#1e293b 0%,#090d16 100%);display:flex;flex-direction:column}
header{padding:10px 14px 0;max-width:480px;width:100%;margin:0 auto;flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.best{background:rgba(30,41,59,.85);border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:5px 9px;line-height:1.1;min-width:72px}
.best small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#fcd34d}
.best b{font-size:18px;color:var(--gold)}
h1{margin:0;font-size:26px;font-weight:700;background:linear-gradient(90deg,#67e8f9,#38bdf8,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{color:var(--gold);-webkit-text-fill-color:var(--gold)}
.btns{display:flex;gap:4px}
button{font-family:inherit;cursor:pointer}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid #334155;background:rgba(30,41,59,.9);color:#fff;font-size:17px;padding:0}
.ib:active{transform:scale(.93)}
.score{text-align:center;margin-top:2px}
.score small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#score{display:block;font-size:44px;font-weight:700;line-height:1}
#combo{height:24px;display:flex;justify-content:center;align-items:center}
#combo span{padding:2px 12px;border-radius:99px;font-size:12px;font-weight:700;text-transform:uppercase;background:linear-gradient(90deg,#f59e0b,#f43f5e);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.hidden{display:none!important}
main{flex:1;min-height:0;width:100%}
canvas{display:block;width:100%;height:100%}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{width:100%;max-width:360px;background:rgba(30,41,59,.85);border:1px solid rgba(100,116,139,.5);border-radius:24px;padding:28px 24px;text-align:center}
.card h2{margin:0 0 4px;font-size:30px}
.card p{margin:0 0 20px;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stats div{background:rgba(15,23,42,.8);border:1px solid #334155;border-radius:16px;padding:10px}
.stats small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats b{font-size:24px;color:var(--cyan)}
.stats div:last-child b{color:var(--gold)}
#rec{margin-bottom:16px;padding:6px;border-radius:12px;background:rgba(245,158,11,.2);border:1px solid rgba(251,191,36,.4);color:#fcd34d;font-weight:700;font-size:14px}
.play{width:100%;padding:14px;border:0;border-radius:16px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(90deg,#10b981,#14b8a6);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.play:active{transform:translateY(3px);box-shadow:none}
.alt{background:linear-gradient(90deg,#f59e0b,#f43f5e);margin-bottom:10px}
#rk{position:fixed;inset:0;background:rgba(2,6,23,.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.namebox{display:flex;gap:8px;margin-bottom:12px}
input{user-select:text;-webkit-user-select:text;touch-action:auto;flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid #334155;background:rgba(15,23,42,.9);color:#fff;font:inherit;font-size:16px}
.sm{padding:0 16px;border:0;border-radius:12px;background:#0ea5e9;color:#fff;font-weight:700;font-size:15px}
#rl{list-style:none;margin:0 0 14px;padding:0;max-height:42vh;overflow-y:auto;text-align:left;touch-action:pan-y}
#rl *{touch-action:pan-y}
#rl li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:16px;border:1px solid transparent}
#rl li span:first-child{width:34px;text-align:center;color:var(--muted)}
#rl li span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rl li b{color:var(--gold)}
#rl li.me{background:rgba(34,211,238,.15);border-color:rgba(34,211,238,.4)}
#rl li.msg{justify-content:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="best"><small>Recorde</small><b id="best">0</b></div>
    <h1>block<span>?</span></h1>
    <div class="btns">
      <button class="ib" id="bk" aria-label="Ranking">🏆</button>
      <button class="ib" id="bv" aria-label="Vibração">📳</button>
      <button class="ib" id="bs" aria-label="Som">🔊</button>
      <button class="ib" id="br" aria-label="Reiniciar">↻</button>
    </div>
  </div>
  <div class="score"><small>Pontuação</small><span id="score">0</span>
    <div id="combo"><span id="ctext" class="hidden"></span></div></div>
</header>
<main id="wrap"><canvas id="cv"></canvas></main>

<div id="modal" class="hidden">
  <div class="card">
    <h2>Fim de Jogo</h2>
    <p>Não há mais espaço no tabuleiro!</p>
    <div class="stats"><div><small>Pontuação</small><b id="fs">0</b></div><div><small>Recorde</small><b id="fb">0</b></div></div>
    <div id="rec" class="hidden">🏆 Novo Recorde Alcançado!</div>
    <button class="play alt" id="rbtn">🏆 Ver ranking</button>
    <button class="play" id="again">Jogar Novamente</button>
  </div>
</div>

<div id="rk" class="hidden">
  <div class="card">
    <h2>🏆 Ranking</h2>
    <p>Os melhores recordes dos jogadores</p>
    <div class="namebox"><input id="nin" maxlength="15" placeholder="Seu apelido" autocomplete="off"><button class="sm" id="nsave">Salvar</button></div>
    <ol id="rl"></ol>
    <button class="play" id="rclose">Fechar</button>
  </div>
</div>

<script>
// ---------- storage seguro (localStorage pode falhar no celular) ----------
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch (e) {} }
};

// ---------- som e vibração ----------
const FX = {
  ctx:null, muted: store.get('blockq_muted')==='true', vib: store.get('blockq_vibrate')!=='false',
  init(){
    if(!this.ctx){
      const A=window.AudioContext||window.webkitAudioContext;
      if(A){
        this.ctx=new A();
        this.out=this.ctx.createGain(); this.out.gain.value=1.6;
        const comp=this.ctx.createDynamicsCompressor();
        this.out.connect(comp); comp.connect(this.ctx.destination);
      }
    }
    if(this.ctx && this.ctx.state!=='running') this.ctx.resume();
  },
  // Celulares só liberam o áudio depois de um toque/clique de verdade
  unlock(){
    if(this.ctx && this.ctx.state==='running' && this.elDone) return;
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
    this.init();
    if(this.ctx){
      try{ const s=this.ctx.createBufferSource(); s.buffer=this.ctx.createBuffer(1,1,22050); s.connect(this.ctx.destination); s.start(0); }catch(e){}
    }
    if(!this.elDone){
      this.elDone=true;
      const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      if(ios){ // faz o som tocar mesmo com o iPhone no modo silencioso
        try{ const a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='); a.loop=true; a.play().catch(()=>{}); }catch(e){}
      }
    }
  },
  v(p){ if(!this.vib||!navigator.vibrate) return; try{ navigator.vibrate(p); }catch(e){} },
  tone(f,f2,dur,type,vol,delay){
    if(this.muted) return; this.init(); if(!this.ctx) return;
    const t=this.ctx.currentTime+(delay||0), o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(this.out||this.ctx.destination); o.start(t); o.stop(t+dur+.02);
  },
  pickup(){ this.v(15); this.tone(340,620,.07,'sine',.16); },
  hover(){ this.v(8); this.tone(780,520,.025,'sine',.045); },
  place(){ this.v(45); this.tone(210,72,.11,'triangle',.3); },
  invalid(){ this.v([30,40,30]); this.tone(155,110,.09,'sine',.11); },
  clear(n,combo){
    this.v(n>1?[50,30,90]:[35,25,60]);
    const sc=[523.25,659.25,783.99,1046.5,1318.51,1567.98], boost=Math.min((combo-1)*45,270);
    for(let i=0;i<Math.min(n+2,6);i++) this.tone(sc[i]+boost,(sc[i]+boost)*1.03,.36,i%2?'triangle':'sine',.2,i*.05);
  },
  allClear(){
    this.v([40,30,40,30,90]);
    [523.25,659.25,783.99,987.77,1046.5,1318.51,1567.98].forEach((f,i)=>this.tone(f,f*1.015,.7,'triangle',.2,i*.055));
  },
  over(){ this.v([60,40,100]); [440,392,349.23,293.66].forEach((f,i)=>this.tone(f,f*.98,.26,'sawtooth',.1,i*.15)); }
};

['touchstart','touchend','pointerdown','pointerup','click','keydown'].forEach(ev=>window.addEventListener(ev,()=>FX.unlock(),{capture:true,passive:true}));

// ---------- cores e peças ----------
const PAL={
  cyan:{top:'#67e8f9',main:'#06b6d4',dark:'#0e7490'}, coral:{top:'#fda4af',main:'#f43f5e',dark:'#be123c'},
  emerald:{top:'#6ee7b7',main:'#10b981',dark:'#047857'}, amber:{top:'#fde047',main:'#f59e0b',dark:'#b45309'},
  purple:{top:'#e879f9',main:'#a855f7',dark:'#6b21a8'}, royal:{top:'#93c5fd',main:'#3b82f6',dark:'#1d4ed8'},
  orange:{top:'#fdba74',main:'#f97316',dark:'#c2410c'}
};
const KEYS=Object.keys(PAL);
const SHAPES=[["1",4],["11",7],["1/1",7],["111",8],["1/1/1",8],["1111",6],["1/1/1/1",6],["11111",4],["1/1/1/1/1",4],
["11/11",9],["111/111/111",4],["111/111",4],["11/11/11",4],["10/11",7],["01/11",7],["11/10",7],["11/01",7],
["100/100/111",4],["001/001/111",4],["111/100/100",4],["111/001/001",4],["10/10/11",6],["01/01/11",6],["11/10/10",6],["11/01/01",6],
["111/100",6],["111/001",6],["100/111",6],["001/111",6],["111/010",6],["010/111",6],["10/11/10",6],["01/11/01",6],
["011/110",5],["110/011",5],["10/11/01",5],["01/11/10",5]]
.map(([s,w])=>({m:s.split('/').map(r=>[...r].map(Number)),w}));
const TOTAL_W=SHAPES.reduce((a,s)=>a+s.w,0);

// ---------- jogo ----------
const N=8;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), wrap=document.getElementById('wrap');
const $=id=>document.getElementById(id);
const G={grid:[],pop:[],tray:[null,null,null],score:0,shown:0,best:parseInt(store.get('blockq_best')||'0',10)||0,
  combo:0,over:false,clearing:[],parts:[],waves:[],texts:[],shake:0,shakeT:0,glow:0,bScale:1,bVel:0,
  drag:{on:false,slot:-1,piece:null,touch:false,px:0,py:0,x:0,y:0,s:.55,hover:null,key:''},L:{}};

function emptyGrid(){ return Array.from({length:N},()=>Array(N).fill(null)); }
function emptyPop(){ return Array.from({length:N},()=>Array(N).fill(1)); }

function resize(){
  const r=wrap.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  const w=r.width,h=r.height, dockH=Math.min(126,Math.max(96,h*.22)), vm=12;
  const availH=h-dockH-vm*3, availW=w-24;
  const size=Math.floor(Math.max(120,Math.min(availW,availH,420)));
  const bx=Math.floor((w-size)/2), by=Math.floor(vm+(availH-size)*.45);
  const pad=Math.max(8,Math.floor(size*.028)), gap=Math.max(3,Math.floor(size*.013));
  const cell=(size-pad*2-gap*(N-1))/N, step=cell+gap;
  const dockW=Math.min(w-16,Math.max(size,300)), dockX=Math.floor((w-dockW)/2), dockY=Math.floor(by+size+vm*1.2);
  const sw=dockW/3;
  G.L={w,h,dpr,bx,by,size,pad,gap,cell,step,dockX,dockY,dockW,dockH,
    slots:[0,1,2].map(i=>({x:dockX+sw*(i+.5),y:dockY+dockH/2}))};
}

function newPiece(){
  let r=Math.random()*TOTAL_W, s=SHAPES[0];
  for(const x of SHAPES){ if(r<x.w){ s=x; break; } r-=x.w; }
  return {m:s.m,rows:s.m.length,cols:s.m[0].length,color:KEYS[Math.floor(Math.random()*KEYS.length)],spawn:.1};
}

function newGame(){
  Object.assign(G,{grid:emptyGrid(),pop:emptyPop(),clearing:[],parts:[],waves:[],texts:[],score:0,shown:0,combo:0,glow:0,over:false});
  G.drag.on=false; G.drag.piece=null;
  $('score').textContent='0'; $('best').textContent=G.best.toLocaleString('pt-BR');
  comboBadge(); $('modal').classList.add('hidden'); spawnTray();
}
function spawnTray(){ for(let i=0;i<3;i++) G.tray[i]=newPiece(); checkOver(); }

function canPlace(p,sr,sc){
  for(let r=0;r<p.rows;r++) for(let c=0;c<p.cols;c++) if(p.m[r][c]){
    const gr=sr+r, gc=sc+c;
    if(gr<0||gr>=N||gc<0||gc>=N||G.grid[gr][gc]) return false;
  }
  return true;
}
function fitsAnywhere(p){
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(canPlace(p,r,c)) return true;
  return false;
}
function lines(g){
  const rows=[],cols=[];
  for(let r=0;r<N;r++) if(g[r].every(x=>x)) rows.push(r);
  for(let c=0;c<N;c++){ let f=true; for(let r=0;r<N;r++) if(!g[r][c]){f=false;break;} if(f) cols.push(c); }
  return {rows,cols};
}
function simLines(p,sr,sc){
  const g=G.grid.map(r=>[...r]);
  for(let r=0;r<p.rows;r++) for(let c=0;c<p.cols;c++) if(p.m[r][c]) g[sr+r][sc+c]=p.color;
  return lines(g);
}
const cellCenter=(r,c)=>({x:G.L.bx+G.L.pad+c*G.L.step+G.L.cell/2, y:G.L.by+G.L.pad+r*G.L.step+G.L.cell/2});

// ---------- entrada (mouse + toque) ----------
function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

cv.addEventListener('pointerdown',e=>{
  FX.init();
  if(G.over||G.drag.on) return;
  const {x,y}=pos(e), L=G.L;
  if(y<L.dockY-14||y>L.dockY+L.dockH+18) return;
  let idx=-1,best=Infinity;
  L.slots.forEach((s,i)=>{ if(!G.tray[i]) return; const d=Math.hypot(x-s.x,y-s.y); if(d<best){best=d;idx=i;} });
  if(idx<0||best>L.dockW*.26) return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const d=G.drag;
  Object.assign(d,{on:true,slot:idx,piece:G.tray[idx],touch:e.pointerType!=='mouse',px:x,py:y,x:L.slots[idx].x,y:L.slots[idx].y,s:.55,hover:null,key:''});
  FX.pickup(); updateHover();
});
cv.addEventListener('pointermove',e=>{
  if(!G.drag.on) return;
  const {x,y}=pos(e); G.drag.px=x; G.drag.py=y; updateHover();
});
function lift(p){ return G.drag.touch?Math.max(76,(p.rows*G.L.step-G.L.gap)*.72):14; }
function updateHover(){
  const d=G.drag, p=d.piece, L=G.L; if(!p) return;
  const pw=p.cols*L.step-L.gap, ph=p.rows*L.step-L.gap;
  const tx=d.px-pw/2, ty=d.py-lift(p)-ph/2;
  const col=Math.round((tx-L.bx-L.pad)/L.step), row=Math.round((ty-L.by-L.pad)/L.step);
  if(canPlace(p,row,col)){
    d.hover={r:row,c:col}; const k=row+','+col;
    if(k!==d.key){ d.key=k; FX.hover(); }
  } else { d.hover=null; d.key=''; }
}
function endDrag(e){
  const d=G.drag; if(!d.on) return;
  const {slot,piece,hover}=d; d.on=false; d.piece=null; d.hover=null;
  if(e&&e.type==='pointerup'&&piece&&hover&&canPlace(piece,hover.r,hover.c)) place(slot,piece,hover.r,hover.c);
  else if(e&&e.type==='pointerup') FX.invalid();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
window.addEventListener('pointerup',endDrag);
document.addEventListener('touchmove',e=>{ if(!(e.target.closest&&e.target.closest('#rl'))) e.preventDefault(); },{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

// ---------- regras ----------
function place(slot,p,sr,sc){
  FX.place(); G.bVel=-.025; shake(3,.14);
  let placed=0;
  for(let r=0;r<p.rows;r++) for(let c=0;c<p.cols;c++) if(p.m[r][c]){
    const gr=sr+r, gc=sc+c; G.grid[gr][gc]=p.color; G.pop[gr][gc]=.45; placed++;
    const ct=cellCenter(gr,gc); burst(ct.x,ct.y,PAL[p.color].top,4,95);
  }
  G.tray[slot]=null;
  let pts=placed*10;
  const {rows,cols}=lines(G.grid), n=rows.length+cols.length;
  if(n>0){
    G.combo++;
    const cp=Math.round((n*100+(n>1?(n-1)*120:0))*(1+(G.combo-1)*.5));
    pts+=cp; clearLines(rows,cols,cp);
    if(G.grid.every(r=>r.every(x=>!x))){ pts+=500; allClear(500); } else FX.clear(n,G.combo);
  } else G.combo=0;
  addScore(pts); comboBadge();
  if(G.tray.every(x=>!x)) setTimeout(spawnTray,n?260:100); else setTimeout(checkOver,n?280:50);
}
function clearLines(rows,cols,pts){
  const set=new Set();
  rows.forEach(r=>{ for(let c=0;c<N;c++) set.add(r+','+c); });
  cols.forEach(c=>{ for(let r=0;r<N;r++) set.add(r+','+c); });
  const n=rows.length+cols.length; shake(Math.min(4+n*2,11),.24);
  let sx=0,sy=0,cnt=0;
  set.forEach(k=>{
    const [r,c]=k.split(',').map(Number), col=G.grid[r][c]; if(!col) return;
    const ct=cellCenter(r,c); sx+=ct.x; sy+=ct.y; cnt++;
    G.clearing.push({r,c,color:col,t:0});
    burst(ct.x,ct.y,PAL[col].main,7,210); burst(ct.x,ct.y,PAL[col].top,4,140);
    G.grid[r][c]=null;
  });
  if(!cnt) return;
  const ax=sx/cnt, ay=sy/cnt;
  if(n>=2) G.waves.push({x:ax,y:ay,r:10,max:G.L.size*.72,a:.85,c:'#38bdf8',w:5});
  banner(ax,ay,'+'+pts,'#fde047',28);
  let t='',tc='#67e8f9';
  if(n>=4){t='INACREDITÁVEL!';tc='#fb7185';} else if(n===3){t='ESPETACULAR!';tc='#e879f9';}
  else if(n===2){t='EXCELENTE!';tc='#6ee7b7';} else if(G.combo>=2){t='COMBO x'+G.combo+'!';tc='#fdba74';}
  if(t) banner(ax,ay-34,t,tc,20);
}
function allClear(bonus){
  FX.allClear(); G.glow=1; G.bVel=.06; shake(10,.42);
  const L=G.L, cx=L.bx+L.size/2, cy=L.by+L.size/2;
  G.waves.push({x:cx,y:cy,r:12,max:L.size*.95,a:1,c:'#fbbf24',w:7},{x:cx,y:cy,r:4,max:L.size*.78,a:.9,c:'#22d3ee',w:4});
  const cols=['#fde047','#22d3ee','#fb7185','#34d399','#c084fc','#ffffff'];
  for(let i=0;i<70;i++){
    const a=Math.PI*2*i/70+(Math.random()-.5)*.2, s=130+Math.random()*290;
    G.parts.push({x:cx+(Math.random()-.5)*40,y:cy+(Math.random()-.5)*40,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,
      size:5+Math.random()*6,color:cols[i%6],life:0,max:.85+Math.random()*.55,g:240,rot:Math.random()*6,vr:(Math.random()-.5)*12,conf:true});
  }
  banner(cx,cy-14,'✨ TELA LIMPA! ✨','#fde047',30,1.45);
  banner(cx,cy+24,'+'+bonus+' BÔNUS','#67e8f9',22,1.45);
}
function burst(x,y,color,n,maxS){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, s=35+Math.random()*maxS;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,size:3.5+Math.random()*4.5,color,life:0,max:.35+Math.random()*.3,g:360,rot:Math.random()*6,vr:(Math.random()-.5)*10,conf:false});
  }
}
function banner(x,y,text,color,size,dur){ G.texts.push({x,y,text,color,size,life:0,max:dur||1.05,s:.4}); }
function shake(i,t){ G.shake=Math.max(G.shake,i); G.shakeT=Math.max(G.shakeT,t); }
function addScore(p){
  G.score+=p;
  if(G.score>G.best){ G.best=G.score; store.set('blockq_best',G.best); $('best').textContent=G.best.toLocaleString('pt-BR'); }
}
function comboBadge(){
  const el=$('ctext');
  if(G.combo>=2){ el.textContent='Combo x'+G.combo+'! 🔥'; el.classList.remove('hidden'); } else el.classList.add('hidden');
}
function checkOver(){
  if(G.over) return;
  const rem=G.tray.filter(Boolean); if(!rem.length) return;
  if(!rem.some(fitsAnywhere)){
    G.over=true;
    setTimeout(()=>{
      FX.over();
      $('fs').textContent=G.score.toLocaleString('pt-BR'); $('fb').textContent=G.best.toLocaleString('pt-BR');
      $('rec').classList.toggle('hidden',!(G.score>0&&G.score>=G.best));
      $('modal').classList.remove('hidden');
      submitScore();
      if(!myName()&&online()&&G.score>0) setTimeout(openRanking,700);
    },450);
  }
}

// ---------- física ----------
function update(dt){
  if(G.shown<G.score){
    const d=G.score-G.shown; G.shown=Math.min(G.score,G.shown+Math.max(1,Math.ceil(d*Math.min(1,dt*18))));
    $('score').textContent=G.shown.toLocaleString('pt-BR');
  }
  G.bVel=(G.bVel+(1-G.bScale)*260*dt)*Math.exp(-18*dt); G.bScale+=G.bVel*dt;
  if(G.glow>0) G.glow=Math.max(0,G.glow-dt*.65);
  if(G.shakeT>0){ G.shakeT=Math.max(0,G.shakeT-dt); if(!G.shakeT) G.shake=0; }
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(G.pop[r][c]!==1) G.pop[r][c]+=(1-G.pop[r][c])*Math.min(1,dt*14);
  G.tray.forEach(p=>{ if(p&&p.spawn<1) p.spawn=Math.min(1,p.spawn+dt*5.5); });
  const d=G.drag;
  if(d.on&&d.piece){
    const f=1-Math.exp(-38*dt);
    d.x+=(d.px-d.x)*f; d.y+=(d.py-lift(d.piece)-d.y)*f; d.s+=(1-d.s)*f;
  }
  G.clearing=G.clearing.filter(i=>(i.t+=dt/.32)<1);
  G.parts=G.parts.filter(p=>{
    p.life+=dt; if(p.life>=p.max) return false;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.rot+=p.vr*dt; return true;
  });
  G.waves=G.waves.filter(w=>{ w.r+=(w.max-w.r)*Math.min(1,dt*7.5); return (w.a-=dt*1.45)>0; });
  G.texts=G.texts.filter(t=>{
    t.life+=dt; if(t.life>=t.max) return false;
    t.y-=36*dt; const k=t.life/t.max; t.s=k<.18?.5+k/.18*.65:1.15-Math.min(.15,(k-.18)*.4); return true;
  });
}

// ---------- desenho ----------
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function block(x,y,s,key,scale,bright){
  const p=PAL[key]||PAL.cyan, rad=Math.max(4,s*.16);
  ctx.save();
  if(scale!==1){ const cx=x+s/2, cy=y+s/2; ctx.translate(cx,cy); ctx.scale(scale,scale); ctx.translate(-cx,-cy); }
  if(bright>1){ ctx.shadowColor=p.main; ctx.shadowBlur=14; }
  const g=ctx.createLinearGradient(x,y,x+s,y+s); g.addColorStop(0,bright>1?p.top:p.main); g.addColorStop(1,p.dark);
  ctx.fillStyle=g; rr(x,y,s,s,rad); ctx.fill();
  const i=Math.max(2,s*.09), hg=ctx.createLinearGradient(x,y+i,x,y+s*.48);
  hg.addColorStop(0,'rgba(255,255,255,.5)'); hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hg; rr(x+i,y+i,s-i*2,s*.42,rad*.65); ctx.fill();
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.32)'; rr(x+.5,y+.5,s-1,s-1,rad); ctx.stroke();
  ctx.restore();
}
function piece(p,cx,cy,cell,gap,scale){
  const st=cell+gap, tw=p.cols*st-gap, th=p.rows*st-gap;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(scale,scale); ctx.translate(-tw/2,-th/2);
  for(let r=0;r<p.rows;r++) for(let c=0;c<p.cols;c++) if(p.m[r][c]) block(c*st,r*st,cell,p.color,1,1);
  ctx.restore();
}

function render(){
  const L=G.L, {w,h,dpr,bx,by,size,pad,cell,step,dockX,dockY,dockW,dockH}=L;
  ctx.save(); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(G.shakeT>0&&G.shake>0) ctx.translate((Math.random()-.5)*2*G.shake,(Math.random()-.5)*2*G.shake);

  const bcx=bx+size/2, bcy=by+size/2;
  ctx.save(); ctx.translate(bcx,bcy); ctx.scale(G.bScale,G.bScale); ctx.translate(-bcx,-bcy);
  ctx.fillStyle='#11192c'; rr(bx,by,size,size,18); ctx.fill();
  if(G.glow>0){
    ctx.lineWidth=2.5+G.glow*3; ctx.shadowColor='rgba(251,191,36,'+G.glow*.9+')'; ctx.shadowBlur=24*G.glow;
    ctx.strokeStyle='rgba(253,224,71,'+(.4+G.glow*.6)+')';
  } else { ctx.lineWidth=2; ctx.strokeStyle='rgba(71,85,105,.65)'; }
  ctx.stroke(); ctx.shadowBlur=0;

  const d=G.drag, ghost=new Set(), pr=new Set(), pc=new Set();
  if(d.on&&d.piece&&d.hover){
    const p=d.piece;
    for(let r=0;r<p.rows;r++) for(let c=0;c<p.cols;c++) if(p.m[r][c]) ghost.add((d.hover.r+r)+','+(d.hover.c+c));
    const s=simLines(p,d.hover.r,d.hover.c); s.rows.forEach(r=>pr.add(r)); s.cols.forEach(c=>pc.add(c));
  }
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const x=bx+pad+c*step, y=by+pad+r*step;
    ctx.fillStyle='#1b263b'; rr(x,y,cell,cell,6); ctx.fill();
    const col=G.grid[r][c], k=r+','+c, hl=pr.has(r)||pc.has(c);
    if(col) block(x,y,cell,hl&&d.piece?d.piece.color:col,G.pop[r][c],hl?1.25:1);
    else if(ghost.has(k)&&d.piece){ ctx.save(); ctx.globalAlpha=.42; block(x,y,cell,d.piece.color,.94,1); ctx.restore(); }
  }
  for(const i of G.clearing){
    const x=bx+pad+i.c*step, y=by+pad+i.r*step, t=i.t;
    const sc=t<.25?1+t/.25*.18:(1-(t-.25)/.75)*1.18;
    ctx.save(); ctx.globalAlpha=Math.max(0,1-t); block(x,y,cell,i.color,Math.max(.01,sc),1.6); ctx.restore();
  }
  ctx.restore();

  ctx.fillStyle='rgba(30,41,59,.65)'; rr(dockX,dockY,dockW,dockH,18); ctx.fill();
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.stroke();
  G.tray.forEach((p,i)=>{
    if(!p||(d.on&&d.slot===i)) return;
    const c=L.slots[i], mc=Math.min(cell*.62,(dockH*.72)/Math.max(p.rows,p.cols,3)), mg=Math.max(2,mc*.12);
    const s=p.spawn<1?1-Math.pow(1-p.spawn,3):1;
    ctx.save(); ctx.globalAlpha=fitsAnywhere(p)?1:.38; piece(p,c.x,c.y,mc,mg,s); ctx.restore();
  });

  for(const sw of G.waves){
    ctx.save(); ctx.beginPath(); ctx.arc(sw.x,sw.y,sw.r,0,6.283); ctx.strokeStyle=sw.c;
    ctx.globalAlpha=Math.max(0,sw.a); ctx.lineWidth=sw.w; ctx.stroke(); ctx.restore();
  }
  for(const p of G.parts){
    ctx.save(); ctx.globalAlpha=Math.max(0,1-Math.pow(p.life/p.max,1.6));
    ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
    if(p.conf) ctx.fillRect(-p.size/2,-p.size*.35,p.size,p.size*.7); else { rr(-p.size/2,-p.size/2,p.size,p.size,2); ctx.fill(); }
    ctx.restore();
  }
  for(const t of G.texts){
    const a=t.life>t.max*.7?1-(t.life-t.max*.7)/(t.max*.3):1;
    ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.translate(t.x,t.y); ctx.scale(t.s,t.s);
    ctx.font='700 '+t.size+'px Fredoka, system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.75)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3; ctx.fillStyle=t.color; ctx.fillText(t.text,0,0); ctx.restore();
  }
  if(d.on&&d.piece){
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=22; ctx.shadowOffsetY=14;
    piece(d.piece,d.x,d.y,cell,L.gap,d.s); ctx.restore();
  }
  ctx.restore();
}

// ---------- inicialização ----------
let last=performance.now();
function loop(ts){
  const dt=Math.min((ts-last)/1000,.05); last=ts;
  update(dt); render(); requestAnimationFrame(loop);
}
