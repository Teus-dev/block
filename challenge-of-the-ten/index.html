<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Challenge of the Ten</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe8ff;--panel:#ffffff;--ink:#2a2347;--mut:#6d628f;--acc:#e8a200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1630;--panel:#2a2347;--ink:#fff4e0;--mut:#b9aed8;--acc:#ffc94d}}
:root[data-theme="dark"]{--bg:#1b1630;--panel:#2a2347;--ink:#fff4e0;--mut:#b9aed8;--acc:#ffc94d}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
:root{--w:min(96vw,880px,calc((100dvh - 80px)*1.6667))}
#hud,#wrap,#pad{width:var(--w)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
#hud{flex-wrap:wrap;gap:2px 12px}
#hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.05rem}
#hud span{color:var(--mut);font-weight:500}
#pips{display:inline-flex;gap:5px;vertical-align:middle;margin-left:6px}
#pips i{width:11px;height:11px;border-radius:50%;background:var(--panel);border:2px solid var(--mut)}
#pips i.on{background:var(--acc);border-color:var(--acc)}
#wrap{position:relative}
canvas{width:100%;aspect-ratio:5/3;border-radius:14px;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(20,12,45,.78);border-radius:14px;color:#fff4e0;padding:20px}
#ov h2{margin:0 0 6px;font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800}
#ov p{margin:0 0 16px;max-width:46ch;line-height:1.4;color:#d9cff5}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 26px;background:#ffc94d;color:#2a2347;cursor:pointer;font-size:1.1rem}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#pad{display:none;justify-content:space-between;gap:10px}
#pad div{display:flex;gap:10px}
#pad button{min-width:84px;min-height:64px;font-size:1.6rem;background:var(--panel);color:var(--ink);user-select:none;touch-action:none}
@media (pointer:coarse){#pad{display:flex}}
@media (pointer:coarse) and (orientation:landscape){
:root{--w:min(96vw,calc((100dvh - 44px)*1.6667))}
#pad{position:fixed;width:auto;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));pointer-events:none}
#pad button{pointer-events:auto;opacity:.6;min-height:72px;min-width:92px}}
@media (max-width:600px){#hud{font-size:.8rem}#ov{padding:10px}#ov p{font-size:.85rem;margin-bottom:10px}}
#rot{display:none;position:fixed;inset:0;z-index:99;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:var(--bg);color:var(--ink)}
#rot b{font-size:64px;display:block;animation:spin 2.4s ease-in-out infinite}
#rot p{margin:0;font-size:1.3rem;font-weight:800}
@keyframes spin{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="hud"><div>Fase <b id="hL">1</b>/10 <span id="hN"></span></div><div>Dificuldade<span id="pips"></span></div><div>Vidas <b id="hV">3</b> &nbsp; Moedas <b id="hC">0</b></div></div>
<div id="wrap"><canvas id="c" width="800" height="480"></canvas>
<div id="ov"><h2 id="oT"></h2><p id="oP"></p><button id="oB"></button></div></div>
<div id="pad"><div><button id="bl">◀</button><button id="br">▶</button></div><button id="bj">▲</button></div>
<div id="rot"><b>📱</b><p>Gire o celular para jogar na horizontal</p></div>
<script>
const T=40,VW=800,VH=480,R=12;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function build(w,ops){
  const g=Array.from({length:R},()=>Array(w).fill('.')),L={w,g,coins:[],en:[],mv:[],flag:null,cps:[],spawn:{x:0,y:0}};
  const top=x=>{for(let r=0;r<R;r++)if(g[r][x]==='#')return r;return R};
  for(const [k,a,b,c] of ops){
    if(k==='G')for(let x=a;x<=b;x++)for(let r=R-c;r<R;r++)g[r][x]='#';
    else if(k==='P')for(let x=a;x<=b;x++)g[R-c][x]='#';
    else if(k==='S')g[top(a)-1][a]='^';
    else if(k==='C')L.coins.push({x:a*T+20,y:(R-b)*T+20,got:0});
    else if(k==='E')L.en.push({x:a*T+6,y:top(a)*T-32,w:28,h:32,d:-1,dead:0});
    else if(k==='M')L.mv.push({x:a*T,ox:a*T,y:(R-b)*T,w:3*T,h:14,r:c*T,d:1,dx:0});
    else if(k==='F')L.flag={x:a*T,y:(top(a)-2)*T};
    else if(k==='K')L.cps.push({x:a*T,y:top(a)*T,on:0});
  }
  return L;
}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NAMES=['Planície','Vale estreito','Pontes suspensas','Rio móvel','Pedras e espinhos','Floresta de espinhos','Cânion','Ruínas flutuantes','Tempestade','Desafio final'];
function gen(i){
  const r=rng(i*7919+13),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),ops=[];
  let x=0,h=2;
  const flat=n=>{ops.push(['G',x,x+n-1,h]);x+=n;return x-n};
  const coins=(a,n,y)=>{for(let k=0;k<n;k++)ops.push(['C',a+k,y])};
  const types=['gap','spike','step'];
  if(i>=1)types.push('enemy');if(i>=2)types.push('stones');if(i>=3)types.push('mover');
  if(i>=5)types.push('enemy','gap','stones','mover');
  flat(6);
  for(let s=1;s<=11+i;s++){
    if(s%3===0){const a=flat(5);ops.push(['K',a+2]);coins(a+1,3,h+1);continue}
    const t=types[ri(0,types.length-1)];
    if(t==='gap'){const g=ri(i<2?2:3,i<4?3:4);coins(x,g,h+2);x+=g;coins(flat(ri(4,6)),2,h+1)}
    else if(t==='spike'){const two=i>=4&&r()<.6,n=two?9:ri(7,9),a=flat(n);if(two)ops.push(['S',a+2],['S',a+6]);else ops.push(['S',a+ri(3,n-4)]);coins(a+1,3,h+2)}
    else if(t==='enemy'){const n=ri(8,10),a=flat(n);ops.push(['E',a+ri(2,n-3)]);if(i>=5&&r()<.5)ops.push(['E',a+2]);coins(a+1,2,h+2)}
    else if(t==='step'){if(h<4&&(h===2||r()<.6))h++;else h--;coins(flat(ri(4,6)),2,h+1)}
    else if(t==='stones'){const sw=i>=5?1:2;let cx=x+2;for(let q=0,k=ri(3,4);q<k;q++){ops.push(['P',cx,cx+sw-1,h+1+q%2],['C',cx,h+2+q%2]);cx+=sw+2}x=cx;flat(ri(4,6))}
    else{const hi=i>=7?1:0;ops.push(['M',x-1,h+1,2],['M',x+7,h+1+hi,2],['C',x+2,h+3],['C',x+9,h+3+hi]);x+=12;flat(ri(5,7))}
  }
  const a=flat(7);ops.push(['F',a+4]);coins(a+1,3,h+1);
  return {n:NAMES[i],w:x,ops,es:.7+i*.12,ms:1+i*.09,sky:['hsl('+(200+i*9)+',55%,'+(70-i*6)+'%)','hsl('+((40-i*5+360)%360)+',70%,'+(84-i*6.5)+'%)']};
}
const LV=Array.from({length:10},(_,i)=>gen(i));
const keys={l:0,r:0,j:0};let jp=0,li=0,L=null,state='menu',deaths=0,total=0,lives=3,coinsAll=0,cam=0,intro=0,dt=0,parts=[];
const p={x:0,y:0,w:26,h:34,vx:0,vy:0,og:false,coy:0,buf:0,on:null,face:1,t:0};
function load(i){
  li=i;const d=LV[i];L=build(d.w,d.ops);
  const top=[...Array(R).keys()].find(r=>L.g[r][1]==='#');
  Object.assign(p,{x:T+7,y:top*T-p.h,vx:0,vy:0,og:true,coy:0,buf:0,on:null});
  L.spawn={x:p.x,y:p.y};cam=0;intro=150;state='play';parts=[];hud();$('ov').style.display='none';
}
function hud(){
  $('hL').textContent=li+1;$('hN').textContent=LV[li].n;
  $('hC').textContent=total+(L?L.coins.filter(c=>c.got).length:0);$('hV').textContent=lives;
  $('pips').innerHTML=LV.map((_,i)=>'<i class="'+(i<=li?'on':'')+'"></i>').join('');
}
function show(t,pp,b){$('oT').textContent=t;$('oP').textContent=pp;$('oB').textContent=b;$('ov').style.display='flex';$('oB').focus({preventScroll:true})}
function action(){
  if(state==='menu'||state==='end'||state==='over'){total=0;deaths=0;lives=3;coinsAll=0;load(0)}
  else if(state==='won')load(li+1);
}
function spawn(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,l:30+Math.random()*20,c:col})}
function respawn(){Object.assign(p,{x:L.spawn.x,y:L.spawn.y,vx:0,vy:0,og:true,on:null,buf:0,coy:0});cam=Math.max(0,Math.min(L.w*T-VW,p.x-VW/2));state='play'}
function die(){if(state!=='play')return;state='dead';dt=45;deaths++;lives--;spawn(p.x+13,p.y+17,'#fff4e0',22);hud()}
function win(){
  state='won';const got=L.coins.filter(c=>c.got).length;total+=got;hud();
  if(li===LV.length-1){state='end';show('Você venceu!','Passou pelas 10 fases com '+total+' moedas e '+deaths+' mortes. Quer tentar com menos mortes?','Jogar de novo')}
  else show('Fase '+(li+1)+' concluída','Moedas nesta fase: '+got+'/'+L.coins.length+'. A próxima fase é mais difícil.','Próxima fase');
}
const solid=(c,r)=>c<0||c>=L.w?true:r<0||r>=R?false:L.g[r][c]==='#';
function step(){
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.l--});parts=parts.filter(q=>q.l>0);
  if(state==='dead'){if(--dt<=0){if(lives<=0){state='over';show('Fim de jogo','Acabaram as vidas na fase '+(li+1)+', com '+(total+L.coins.filter(c=>c.got).length)+' moedas. Dá para ir mais longe!','Jogar de novo')}else{respawn();hud()}}return}
  if(state!=='play')return;
  const d=LV[li];
  L.mv.forEach(m=>{m.x+=m.d*d.ms;m.dx=m.d*d.ms;if(Math.abs(m.x-m.ox)>m.r)m.d*=-1});
  if(p.on)p.x+=p.on.dx;p.on=null;
  const ax=keys.r-keys.l;if(ax)p.face=ax;
  p.vx+=Math.max(-.8,Math.min(.8,ax*4.2-p.vx));
  if(jp){p.buf=6;jp=0}else if(p.buf>0)p.buf--;
  p.coy=p.og?6:p.coy-1;
  if(p.buf>0&&p.coy>0){p.vy=-11.6;p.buf=0;p.coy=0;p.og=false}
  if(!keys.j&&p.vy<-4)p.vy=-4;
  p.vy=Math.min(12,p.vy+.55);
  p.x+=p.vx;
  for(let r=Math.floor(p.y/T);r<=Math.floor((p.y+p.h-.01)/T);r++){
    if(p.vx>0){const c=Math.floor((p.x+p.w)/T);if(solid(c,r)){p.x=c*T-p.w;p.vx=0}}
    else if(p.vx<0){const c=Math.floor(p.x/T);if(solid(c,r)){p.x=(c+1)*T;p.vx=0}}
  }
  const pb=p.y+p.h;p.y+=p.vy;p.og=false;
  for(let c=Math.floor(p.x/T);c<=Math.floor((p.x+p.w-.01)/T);c++){
    if(p.vy>0){const r=Math.floor((p.y+p.h)/T);if(solid(c,r)){p.y=r*T-p.h;p.vy=0;p.og=true}}
    else if(p.vy<0){const r=Math.floor(p.y/T);if(solid(c,r)){p.y=(r+1)*T;p.vy=0}}
  }
  for(const m of L.mv)if(p.vy>=0&&pb<=m.y+6&&p.y+p.h>=m.y&&p.y+p.h<=m.y+m.h+12&&p.x+p.w>m.x+2&&p.x<m.x+m.w-2){p.y=m.y-p.h;p.vy=0;p.og=true;p.on=m}
  p.t++;
  for(const c of L.coins)if(!c.got&&Math.abs(p.x+13-c.x)<24&&Math.abs(p.y+17-c.y)<28){c.got=1;if(++coinsAll%25===0)lives++;spawn(c.x,c.y,'#ffc94d',8);hud()}
  for(const k of L.cps)if(!k.on&&p.x>k.x-10){k.on=1;L.spawn={x:k.x+7,y:k.y-p.h};spawn(k.x+20,k.y-30,'#7be0a4',12)}
  for(const e of L.en){
    if(e.dead)continue;
    const fx=e.d>0?e.x+e.w+1:e.x-1,col=Math.floor(fx/T);
    if(!solid(col,Math.floor((e.y+e.h+2)/T))||solid(col,Math.floor((e.y+e.h/2)/T))||(L.g[Math.floor((e.y+e.h-4)/T)]||[])[col]==='^')e.d*=-1;
    e.x+=e.d*d.es;
    if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
      if(p.vy>0&&pb<=e.y+14){e.dead=1;p.vy=keys.j?-10.5:-8;spawn(e.x+14,e.y+16,'#ffb340',10)}else die();
    }
  }
  for(let r=Math.floor(p.y/T);r<=Math.floor((p.y+p.h)/T);r++)for(let c=Math.floor(p.x/T);c<=Math.floor((p.x+p.w)/T);c++)
    if(L.g[r]&&L.g[r][c]==='^'&&p.x+p.w>c*T+9&&p.x<c*T+31&&p.y+p.h>r*T+20)die();
  if(p.y>VH+60)die();
  const f=L.flag;if(f&&p.x+p.w>f.x&&p.x<f.x+T&&p.y+p.h>f.y)win();
  if(intro>0)intro--;
  const tc=Math.max(0,Math.min(L.w*T-VW,p.x+13-VW/2));cam+=(tc-cam)*.12;
}
function draw(){
  if(!L)return;
  const s=LV[li].sky,g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,s[0]);g.addColorStop(1,s[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(30,16,70,.22)';
  for(let k=0;k<2;k++){ctx.beginPath();ctx.moveTo(0,VH);for(let x=0;x<=VW;x+=20)ctx.lineTo(x,330-k*40+Math.sin((x+cam*(.2+k*.2))/(110-k*30)+k*2)*(30+k*14));ctx.lineTo(VW,VH);ctx.fill()}
  ctx.save();ctx.translate(-Math.round(cam),0);
  const c0=Math.floor(cam/T),c1=Math.min(L.w-1,c0+21);
  for(let c=c0;c<=c1;c++)for(let r=0;r<R;r++){
    const ch=L.g[r][c];
    if(ch==='#'){ctx.fillStyle='#4a3a7a';ctx.fillRect(c*T,r*T,T,T);if(r===0||L.g[r-1][c]!=='#'){ctx.fillStyle='#7be0a4';ctx.fillRect(c*T,r*T,T,9)}}
    else if(ch==='^'){ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.moveTo(c*T+3,(r+1)*T);ctx.lineTo(c*T+20,r*T+8);ctx.lineTo(c*T+37,(r+1)*T);ctx.fill()}
  }
  const f=L.flag;
  if(f){ctx.fillStyle='#fff4e0';ctx.fillRect(f.x+16,f.y,4,2*T);ctx.fillStyle='#ffc94d';ctx.beginPath();ctx.moveTo(f.x+20,f.y);ctx.lineTo(f.x+44,f.y+12);ctx.lineTo(f.x+20,f.y+24);ctx.fill()}
  for(const k of L.cps){ctx.fillStyle=k.on?'#7be0a4':'#8a7fb0';ctx.fillRect(k.x+18,k.y-44,4,44);ctx.beginPath();ctx.moveTo(k.x+22,k.y-44);ctx.lineTo(k.x+42,k.y-36);ctx.lineTo(k.x+22,k.y-28);ctx.fill()}
  for(const m of L.mv){ctx.fillStyle='#9fe8ff';ctx.beginPath();ctx.roundRect(m.x,m.y,m.w,m.h,6);ctx.fill()}
  for(const c of L.coins)if(!c.got){const b=Math.sin(p.t/12+c.x)*3;ctx.fillStyle='#ffc94d';ctx.beginPath();ctx.arc(c.x,c.y+b,9,0,7);ctx.fill();ctx.fillStyle='#fff1b0';ctx.beginPath();ctx.arc(c.x-3,c.y+b-3,3,0,7);ctx.fill()}
  for(const e of L.en)if(!e.dead){
    ctx.fillStyle='#ff9f2e';ctx.beginPath();ctx.roundRect(e.x,e.y,e.w,e.h,[14,14,6,6]);ctx.fill();
    ctx.fillStyle='#2a2347';ctx.fillRect(e.x+7,e.y+11,5,6);ctx.fillRect(e.x+17,e.y+11,5,6);
    ctx.fillRect(e.x+5,e.y+7,8,2);ctx.fillRect(e.x+16,e.y+7,8,2);
  }
  if(state!=='dead'){
    ctx.fillStyle='#fff4e0';ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,8);ctx.fill();
    ctx.fillStyle='#2a2347';const ex=p.face>0?13:4;ctx.fillRect(p.x+ex,p.y+9,4,7);ctx.fillRect(p.x+ex+8,p.y+9,4,7);
  }
  for(const q of parts){ctx.globalAlpha=Math.min(1,q.l/20);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,5,5)}
  ctx.globalAlpha=1;ctx.restore();
  if(intro>0&&state==='play'){ctx.globalAlpha=Math.min(1,intro/40);ctx.fillStyle='#fff4e0';ctx.font='800 34px "Baloo 2",system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Fase '+(li+1)+' – '+LV[li].n,VW/2,70);ctx.globalAlpha=1}
}
const set=(k,v)=>{if(k==='j'&&v&&!keys.j)jp=1;keys[k]=v};
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')set('l',1);
  if(k==='ArrowRight'||k==='d'||k==='D')set('r',1);
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W')set('j',1);
  if(k==='Enter'){e.preventDefault();action()}
  if((k==='r'||k==='R')&&state==='play')respawn();
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')set('l',0);
  if(k==='ArrowRight'||k==='d'||k==='D')set('r',0);
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W')set('j',0);
});
const padBtns=[['bl','l'],['br','r'],['bj','j']].map(([id,k])=>[$(id),k]);
function padSync(e){
  const on={l:0,r:0,j:0};
  for(const t of e.touches){const el=document.elementFromPoint(t.clientX,t.clientY);for(const [b,k] of padBtns)if(b===el)on[k]=1}
  for(const k in on)if(keys[k]!==on[k])set(k,on[k]);
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev=>$('pad').addEventListener(ev,e=>{e.preventDefault();padSync(e)},{passive:false}));
// tela cheia + paisagem no celular (precisa de um toque do jogador para funcionar)
const portrait=matchMedia('(pointer:coarse) and (orientation:portrait)');
function goFull(){
  try{
    if(!matchMedia('(pointer:coarse)').matches)return;
    const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
    const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};
    if(rq&&!document.fullscreenElement&&!document.webkitFullscreenElement){
      const r=rq.call(el);
      if(r&&r.then)r.then(lock).catch(()=>{});else lock();
    }else lock();
  }catch(e){}
}
$('oB').addEventListener('click',goFull);
